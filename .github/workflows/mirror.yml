          def get_json(url, timeout=20):
              req = urllib.request.Request(url, headers=UA)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.load(r)

          def fetch_prices(deadline):
              prices = {}
              for s in SLUGS:
                  if time.time() > deadline:
                      print("deadline reached, stop early at", s)
                      break
                  try:
                      top = get_json("https://api.warframe.market/v2/orders/item/%s/top" % s)
                      sells = sorted(o["platinum"] for o in top.get("data", {}).get("sell", []) if o.get("visible", True))
                      buys = sorted((o["platinum"] for o in top.get("data", {}).get("buy", []) if o.get("visible", True)), reverse=True)
                      low = sells[:12]
                      rec = {
                          "sell": low[len(low) // 2] if low else None,
                          "sellMin": sells[0] if sells else None,
                          "buy": buys[0] if buys else None,
                          "depth": len(sells),
                      }
                      try:
                          st = get_json("https://api.warframe.market/v1/items/%s/statistics" % s, timeout=10)
                          rows = []
                          sc = st.get("data", {}) or {}
                          for key in ("statistics_closed", "statistics"):
                              cand = sc.get(key) or {}
                              if isinstance(cand, list):
                                  for blk in cand:
                                      rows += (blk.get("48h", []) or blk.get("live", []))
                              elif isinstance(cand, dict):
                                  rows += (cand.get("48h", []) or cand.get("live", []))
                          rows = [(c.get("datetime"), c.get("avg_price"), c.get("volume", 0))
                                  for c in rows if c.get("avg_price") is not None]
                          if len(rows) >= 8:
                              recent = rows[-6:]
                              prior = rows[-42:-6] or rows[:-6]
                              ra = sum(x[1] for x in recent) / len(recent)
                              pa = sum(x[1] for x in prior) / len(prior) if prior else None
                              if pa and ra:
                                  rec["prev"] = round((ra / pa - 1) * 100, 2)
                                  rec["rvol"] = sum(x[2] for x in recent)
                              rec["vol48"] = sum(x[2] for x in rows)
                              rec["avg48"] = round(sum(x[1] for x in rows) / len(rows), 2)
                      except Exception as e:
                          print("  trend skip", s, str(e)[:80])
                      prices[s] = rec
                      time.sleep(0.25)
                  except Exception as e:
                      print("skip", s, str(e)[:120])
                      time.sleep(0.5)
              return prices

          start = time.time()
          deadline = start + 600
          prices = fetch_prices(deadline)
          tz = datetime.timezone(datetime.timedelta(hours=8))
          now = datetime.datetime.now(datetime.timezone.utc)
          out = {
              "generatedAt": now.strftime("%Y-%m-%dT%H:%M:%S.000Z"),
              "generatedAtLocal": now.astimezone(tz).strftime("%Y-%m-%d %H:%M"),
              "platform": "pc",
              "source": "warframe.market via GitHub Action",
              "prices": prices,
          }
          with open("market.json", "w", encoding="utf-8") as f:
              json.dump(out, f, ensure_ascii=False)
          print("market.json written:", len(prices), "items in %.1fs" % (time.time() - start))
          PY

      - name: Commit and push
        run: |
          git config user.name "wf-mirror"
          git config user.email "wf-mirror@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "mirror $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
