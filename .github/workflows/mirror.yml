          ember_prime_set
          energy_siphon
          equilibrium
          equinox_prime_set
          eternal_onslaught
          euphona_prime_set
          exodia_contagion
          exodia_force
          fang_prime_set
          fleeting_expertise
          flow
          frost_prime_set
          fulmin_prime_set
          galvanized_acceleration
