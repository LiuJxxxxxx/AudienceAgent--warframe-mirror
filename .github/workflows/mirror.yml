          vigor
          virtuos_fury
          virtuos_strike
          vitality
          volt_prime_set
          voruna_prime_set
          weeping_wounds
          wisp_prime_set
          wukong_prime_set
          xaku_prime_set
          yareli_prime_set
          zephyr_prime_set
          zhuge_prime_set
