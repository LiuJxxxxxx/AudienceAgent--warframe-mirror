# ============================================================
# Audience Warframe · 共享镜像（世界状态 + 市场行情）GitHub Action
#
# v1.5 修正版：每 15 分钟抓一轮 warframe.market 实时报价（198 件在榜商品），
#   写入 market.json。应用经 gh-proxy / jsdelivr 读取，市场页从此国内直达。
#
# 用法（一次性，约 1 分钟）：
#   1. 打开镜像仓库 AudienceAgent/-warframe-mirror
#   2. 用本文件整体替换 .github/workflows/mirror.yml
#   3. 仓库 Settings → Actions → 确认 Workflow permissions 为 "Read and write"
#   4. Actions 标签页 → 选本工作流 → Run workflow 手动跑一次，确认出现 market.json
#   之后全自动，无需再管。
# ============================================================
name: Mirror Warframe worldstate + market

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch worldstate (zh)
        continue-on-error: true
        run: |
          curl -fsSL --retry 3 --retry-delay 2 \
            -A "wf-hub-mirror/1.5" \
            "https://api.warframestat.us/pc/?language=zh" \
            -o worldstate.json || echo "worldstate fetch failed, keeping previous"
          echo "worldstate bytes: $(wc -c < worldstate.json 2>/dev/null || echo 0)"

      - name: Refresh market quotes
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, urllib.error, datetime

          UA = {
              "User-Agent": "wf-hub-mirror/1.5",
              "Accept": "application/json",
              "Language": "zh-hans",
